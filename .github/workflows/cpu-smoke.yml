name: CPU build and smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install OpenMPI and pinned Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          python -m pip install -r .github/requirements-ci.txt
          python -m pip check

      - name: Check repository consistency
        run: make check

      - name: Clean rebuild compiled domain solvers
        run: make rebuild-domain

      - name: Smoke reference track
        env:
          OMP_NUM_THREADS: "2"
        run: make smoke-reference OMP_NUM_THREADS=2

      - name: Verify reference outputs
        run: python scripts/check_smoke_outputs.py python/serial c/serial cpp/serial c/openmp cpp/openmp

      - name: Smoke domain OpenMP
        run: make smoke-domain-openmp OMP_NUM_THREADS=2

      - name: Verify domain OpenMP outputs
        run: >-
          python scripts/check_smoke_outputs.py
          src/c/openmp_domain_looped src/c/openmp_domain_vectorized
          src/cpp/openmp_domain_looped src/cpp/openmp_domain_vectorized

      - name: Smoke spatial MPI
        run: make smoke-domain-mpi NP=2

      - name: Verify spatial MPI outputs
        run: >-
          python scripts/check_smoke_outputs.py
          src/c/mpi_domain_looped src/c/mpi_domain_vectorized
          src/cpp/mpi_domain_looped src/cpp/mpi_domain_vectorized
          src/python/mpi_domain_looped src/python/mpi_domain_vectorized

      - name: Smoke hybrid domain decomposition
        run: make smoke-domain-hybrid NP=2 OMP_NUM_THREADS=2 NUMBA_NUM_THREADS=2

      - name: Verify hybrid outputs
        run: >-
          python scripts/check_smoke_outputs.py
          src/c/hybrid_mpi_openmp_looped src/c/hybrid_mpi_openmp_vectorized
          src/cpp/hybrid_mpi_openmp_looped src/cpp/hybrid_mpi_openmp_vectorized
          src/python/hybrid_mpi_openmp_looped src/python/hybrid_mpi_openmp_vectorized

      - name: Regenerate selected archived results
        run: make selected-results

      - name: Confirm selected result files are reproducible
        run: git diff --exit-code -- results/selected
