name: Apply canonical domain benchmark cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.head_ref == 'agent/repository-cleanup-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/repository-cleanup-v1
          fetch-depth: 0

      - name: Apply prepared repository patch
        run: |
          tar -xzf .cleanup/repository-cleanup-patch.tar.gz -C .
          chmod +x scripts/run_smoke_cpu.sh scripts/run_domain_solver_benchmark.sh \
            scripts/run_stromboli_all.sh scripts/run_parallel_scaling.py \
            scripts/check_repository_consistency.py scripts/check_smoke_outputs.py \
            scripts/generate_selected_results.py hpc/stromboli/run_strong_scaling_all.sbatch
          rm -rf .cleanup .github/workflows/apply-repository-cleanup.yml

      - name: Commit canonical repository structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Make spatial domain decomposition the canonical MPI track"
          git push origin HEAD:agent/repository-cleanup-v1
