name: Prepare canonical domain tree entries

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-tree:
    if: github.head_ref == 'agent/repository-cleanup-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/repository-cleanup-v1
          fetch-depth: 0

      - name: Reconstruct and stage final repository
        run: |
          cat .cleanup/bigchunks/part* > /tmp/repository-cleanup-patch.b64
          base64 --decode /tmp/repository-cleanup-patch.b64 > /tmp/repository-cleanup-patch.tar.gz
          test "$(sha256sum /tmp/repository-cleanup-patch.tar.gz | awk '{print $1}')" = "1bfd723606c73264076a8a1b41c6c3bfe51009accbe16bfd07eeed85086894e8"
          gzip -t /tmp/repository-cleanup-patch.tar.gz
          tar -xzf /tmp/repository-cleanup-patch.tar.gz -C .
          chmod +x scripts/run_smoke_cpu.sh scripts/run_domain_solver_benchmark.sh \
            scripts/run_stromboli_all.sh scripts/run_parallel_scaling.py \
            scripts/check_repository_consistency.py scripts/check_smoke_outputs.py \
            scripts/generate_selected_results.py hpc/stromboli/run_strong_scaling_all.sbatch
          rm -rf .cleanup .github/workflows/apply-repository-cleanup.yml
          git add -A

      - name: Create blobs and export tree entries
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          blobs_url = f"https://api.github.com/repos/{repo}/git/blobs"

          def create_blob(content):
              payload = json.dumps({"content": content, "encoding": "base64"}).encode()
              request = urllib.request.Request(blobs_url, data=payload, method="POST")
              request.add_header("Authorization", f"Bearer {token}")
              request.add_header("Accept", "application/vnd.github+json")
              request.add_header("X-GitHub-Api-Version", "2022-11-28")
              with urllib.request.urlopen(request) as response:
                  return json.load(response)["sha"]

          base_tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          raw = subprocess.check_output(
              ["git", "diff", "--cached", "--no-renames", "--name-status", "-z"]
          ).decode().split("\0")

          entries = []
          index = 0
          while index < len(raw) - 1:
              status, path = raw[index], raw[index + 1]
              index += 2
              if status == "D":
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue
              mode = subprocess.check_output(
                  ["git", "ls-files", "-s", "--", path], text=True
              ).split()[0]
              with open(path, "rb") as file:
                  encoded = base64.b64encode(file.read()).decode()
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": create_blob(encoded)})

          with open("base-tree-sha.txt", "w", encoding="utf-8") as file:
              file.write(base_tree + "\n")
          with open("tree-entries.json", "w", encoding="utf-8") as file:
              json.dump(entries, file)
          print(f"Exported {len(entries)} final tree entries")
          PY

      - name: Upload final tree entries
        uses: actions/upload-artifact@v4
        with:
          name: canonical-domain-tree-entries
          path: |
            base-tree-sha.txt
            tree-entries.json
          if-no-files-found: error
